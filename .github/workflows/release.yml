name: Release

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-2
  IAM_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create tags and releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: |
          TAG="v$(date +'%Y.%m.%d').${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

      - name: Inject version into index.html
        run: |
          sed -i "s|id=\"app-version\">dev<|id=\"app-version\">${{ steps.version.outputs.tag }}<|" index.html

      - name: Version asset filenames
        run: |
          TAG=${{ steps.version.outputs.tag }}
          cp editor.js editor.${TAG}.js
          cp diagram.css diagram.${TAG}.css
          sed -i "s|href=\"diagram.css\"|href=\"diagram.${TAG}.css\"|" index.html
          sed -i "s|src=\"editor.js\"|src=\"editor.${TAG}.js\"|" index.html

      - name: Package release files
        run: |
          TAG=${{ steps.version.outputs.tag }}
          tar -czf diagram-editor.tar.gz \
            index.html editor.${TAG}.js diagram.${TAG}.css help.html about.html faq.html privacy.html contact.html terms.html blog.html blog-why-i-built.html README.md \
            icons/manifest.js icons/manifest.json \
            icons/AWS icons/Azure icons/GCP \
            scripts/generate-manifest.js

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Diagram Editor ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            diagram-editor.tar.gz

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      pages: write      # required to deploy to GitHub Pages
      id-token: write   # required for OIDC Pages deployment

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: |
          TAG="v$(date +'%Y.%m.%d').${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Inject version into index.html
        run: |
          sed -i "s|id=\"app-version\">dev<|id=\"app-version\">${{ steps.version.outputs.tag }}<|" index.html

      - name: Version asset filenames
        run: |
          TAG=${{ steps.version.outputs.tag }}
          cp editor.js editor.${TAG}.js
          cp diagram.css diagram.${TAG}.css
          sed -i "s|href=\"diagram.css\"|href=\"diagram.${TAG}.css\"|" index.html
          sed -i "s|src=\"editor.js\"|src=\"editor.${TAG}.js\"|" index.html

      - name: Build Pages artifact
        run: |
          TAG=${{ steps.version.outputs.tag }}
          mkdir -p _site
          cp index.html help.html about.html faq.html privacy.html contact.html terms.html blog.html blog-why-i-built.html editor.${TAG}.js diagram.${TAG}.css README.md _site/
          cp -r icons _site/icons
          cp -r scripts _site/scripts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  deploy-s3:
    name: Deploy to AWS S3
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write   # required for OIDC role assumption

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: |
          TAG="v$(date +'%Y.%m.%d').${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Inject version into index.html
        run: |
          sed -i "s|id=\"app-version\">dev<|id=\"app-version\">${{ steps.version.outputs.tag }}<|" index.html

      - name: Version asset filenames
        run: |
          TAG=${{ steps.version.outputs.tag }}
          cp editor.js editor.${TAG}.js
          cp diagram.css diagram.${TAG}.css
          sed -i "s|href=\"diagram.css\"|href=\"diagram.${TAG}.css\"|" index.html
          sed -i "s|src=\"editor.js\"|src=\"editor.${TAG}.js\"|" index.html

      - name: Debug OIDC token
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
        
          # Decode claims (header.payload.signature)
          echo "$OIDC_TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq
          # Look at: sub, aud, ref, environment

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          role-session-name: github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync site to S3
        run: |
          TAG=${{ steps.version.outputs.tag }}
          aws s3 sync . s3://${{ env.S3_BUCKET }} \
            --delete \
            --exclude "*" \
            --include "ads.txt" \
            --include "index.html" \
            --include "help.html" \
            --include "about.html" \
            --include "faq.html" \
            --include "privacy.html" \
            --include "contact.html" \
            --include "terms.html" \
            --include "blog.html" \
            --include "blog-why-i-built.html" \
            --include "editor.${TAG}.js" \
            --include "diagram.${TAG}.css" \
            --include "icons/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
