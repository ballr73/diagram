<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Shipping container shape -->
  <rect x="8" y="14" width="48" height="36" rx="2"/>
  <!-- Vertical ribs (container corrugation) -->
  <line x1="18" y1="14" x2="18" y2="50"/>
  <line x1="28" y1="14" x2="28" y2="50"/>
  <line x1="38" y1="14" x2="38" y2="50"/>
  <line x1="48" y1="14" x2="48" y2="50"/>
  <!-- Top bar -->
  <line x1="8" y1="20" x2="56" y2="20"/>
  <!-- Bottom bar -->
  <line x1="8" y1="44" x2="56" y2="44"/>
  <!-- Door handles -->
  <line x1="30" y1="50" x2="34" y2="50"/>
  <line x1="30" y1="54" x2="34" y2="54"/>
  <line x1="32" y1="50" x2="32" y2="54"/>
</svg>
